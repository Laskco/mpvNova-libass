name: Android libass profile
on:
  push:
    branches: [fle-performance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Laskco/mpvNova
          ref: a083f74b3658dfd3e858a28065e5e9cf4bb9dad0
          path: player
          sparse-checkout: buildscripts
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkgconf ninja-build gperf nasm
          python3 -m pip install --break-system-packages meson
      - uses: actions/cache@v5
        with:
          path: |
            player/buildscripts/prefix
            player/buildscripts/deps
            player/buildscripts/sdk
          key: fle-deps-arm64-ndk30-v1
      - name: Prepare pinned dependencies
        run: |
          set -euo pipefail
          base="$PWD"
          cd player/buildscripts
          . include/depinfo.sh
          mkdir -p deps sdk
          if [ ! -d sdk/android-ndk-r30 ]; then
            curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o "$RUNNER_TEMP/ndk.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d sdk
          fi
          cd deps
          if [ ! -d freetype2 ]; then
            git clone --depth 1 --branch "VER-${v_freetype//./-}" --recurse-submodules https://gitlab.freedesktop.org/freetype/freetype.git freetype2
          fi
          if [ ! -d fribidi ]; then
            mkdir fribidi
            curl -fL --retry 3 "https://github.com/fribidi/fribidi/releases/download/v$v_fribidi/fribidi-$v_fribidi.tar.xz" | tar -xJ -C fribidi --strip-components=1
          fi
          if [ ! -d harfbuzz ]; then
            mkdir harfbuzz
            curl -fL --retry 3 "https://github.com/harfbuzz/harfbuzz/releases/download/$v_harfbuzz/harfbuzz-$v_harfbuzz.tar.xz" | tar -xJ -C harfbuzz --strip-components=1
          fi
          if [ ! -d unibreak ]; then
            mkdir unibreak
            curl -fL --retry 3 "https://github.com/adah1972/libunibreak/releases/download/libunibreak_${v_unibreak//./_}/libunibreak-${v_unibreak}.tar.gz" | tar -xz -C unibreak --strip-components=1
          fi
          if [ ! -d libxml2 ]; then
            mkdir libxml2
            curl -fL --retry 3 "https://gitlab.gnome.org/GNOME/libxml2/-/archive/v$v_libxml2/libxml2-v$v_libxml2.tar.gz" | tar -xz -C libxml2 --strip-components=1
          fi
          if [ ! -d fontconfig ]; then
            mkdir fontconfig
            curl -fL --retry 3 "https://gitlab.freedesktop.org/fontconfig/fontconfig/-/archive/${v_fontconfig}/fontconfig-${v_fontconfig}.tar.gz" | tar -xz -C fontconfig --strip-components=1
          fi
          rm -rf libass
          git clone --no-hardlinks "$base" libass
          git -C libass checkout "$GITHUB_SHA"
      - name: Build same-version subtitle stack
        run: |
          set -euo pipefail
          cd player/buildscripts
          chmod +x buildall.sh scripts/*.sh
          if [ ! -f prefix/arm64/lib/libfontconfig.a ]; then
            ./buildall.sh --arch arm64 fontconfig
            ./buildall.sh --arch arm64 harfbuzz
            ./buildall.sh --arch arm64 fribidi
            ./buildall.sh --arch arm64 unibreak
          fi
          ./buildall.sh --arch arm64 -n libass
          # buildall deliberately clears compiler flags. Rebuild only libass with
          # timing enabled after configuration; dependencies remain unchanged.
          cd deps/libass/_build_arm64
          make clean
          make -j2 CPPFLAGS=-DASS_FLE_PROFILE
          make DESTDIR="$GITHUB_WORKSPACE/player/buildscripts/prefix/arm64" install
      - name: Link standalone benchmark
        run: |
          set -euo pipefail
          prefix="$PWD/player/buildscripts/prefix/arm64"
          toolchain="$PWD/player/buildscripts/sdk/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PKG_CONFIG_SYSROOT_DIR="$prefix"
          export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig"
          mkdir -p collected
          "$toolchain/aarch64-linux-android23-clang" -O2 -g -fno-omit-frame-pointer \
            profile/fle-bench.c $(pkg-config --cflags --static libass) -c -o collected/fle-bench.o
          "$toolchain/aarch64-linux-android23-clang++" -static-libstdc++ \
            collected/fle-bench.o $(pkg-config --libs --static libass) -o collected/fle-bench
          cp player/buildscripts/deps/libass/_build_arm64/.libs/libass.a collected/
          git rev-parse HEAD > collected/revision.txt
          tar -czf collected/subtitle-prefix-arm64.tgz -C player/buildscripts prefix/arm64
      - uses: actions/upload-artifact@v7
        with:
          name: libass-arm64-profile
          if-no-files-found: error
          path: collected/
