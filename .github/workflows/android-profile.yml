name: Android libass profile
on:
  push:
    branches: [fle-performance, noucome-ass-drift]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate, production]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: libass/libass-tests
          path: art
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y meson ninja-build nasm build-essential pkgconf \
            libfreetype-dev libfontconfig-dev libharfbuzz-dev libfribidi-dev libpng-dev libunibreak-dev
      - name: Configure reference or candidate
        id: build
        run: |
          flags=''
          if [ '${{ matrix.source }}' = baseline ]; then
            # Frozen upstream compatibility reference, not a current-fork control.
            git checkout f61db567e6593df3470e91594bcd4ad2d0473aff
          else
            flags=-DASS_EVENT_THREADS
            if [ '${{ matrix.source }}' = production ]; then
              flags="$flags -DASS_FONTCONFIG_ATOMIC_REFS=1"
            fi
          fi
          meson setup build --buildtype=debugoptimized -Dc_args="$flags" \
            -Db_sanitize=address,undefined -Dtest=enabled -Dcompare=enabled \
            -Dfuzz=enabled -Dcheckasm=enabled -Dart-samples="$PWD/art"
          meson compile -C build
      - name: Check experimental outline clipping under sanitizers
        # This strict check uses fork-only APIs absent from the upstream snapshot.
        if: matrix.source != 'baseline'
        run: |
          cc -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
            -ffunction-sections -fdata-sections -Ibuild -Ilibass \
            $(pkg-config --cflags freetype2) profile/edge-check.c \
            libass/ass_outline.c libass/ass_rasterizer.c libass/ass_utils.c \
            -Wl,--gc-sections -lm -o build/edge-check
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 build/edge-check
      - name: Exercise experimental mode with malformed subtitle inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.source != 'baseline' }}
        env:
          LIBASS_EXPERIMENTAL_EDGES: '1'
          LIBASS_RENDER_THREADS: '4'
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: meson test -C build checkasm art-fuzz --timeout-multiplier 4 --print-errorlogs
      - name: Exercise low-end mode with malformed subtitle inputs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.source != 'baseline' }}
        env:
          LIBASS_EXPERIMENTAL_EDGES: '2'
          LIBASS_RENDER_THREADS: '4'
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: meson test -C build art-fuzz --timeout-multiplier 4 --print-errorlogs
      - name: Run upstream regression and malformed-input tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          # Existing edges-on visual differences are not ordinary baseline tests.
          LIBASS_EXPERIMENTAL_EDGES: '0'
          LIBASS_RENDER_THREADS: '4'
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: meson test -C build --timeout-multiplier 4 --print-errorlogs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression-${{ matrix.source }}
          path: build/meson-logs/testlog.txt
  android-bench:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            cc: aarch64-linux-android23-clang
            cxx: aarch64-linux-android23-clang++
          - arch: armv7l
            cc: armv7a-linux-androideabi23-clang
            cxx: armv7a-linux-androideabi23-clang++
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: Laskco/mpvNova
          ref: 23c532f3369a3fcbfee682e382adb89003416143
          path: player
          sparse-checkout: buildscripts
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkgconf ninja-build gperf nasm
          python3 -m pip install --break-system-packages meson
      - uses: actions/cache@v5
        with:
          path: |
            player/buildscripts/prefix
            player/buildscripts/deps
            player/buildscripts/sdk
          key: fle-deps-${{ matrix.arch }}-ndk30-23c532f3-v2
      - name: Prepare pinned dependencies
        run: |
          set -euo pipefail
          base="$PWD"
          cd player/buildscripts
          . include/depinfo.sh
          mkdir -p deps sdk
          if [ ! -d sdk/android-ndk-r30 ]; then
            curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r30-linux.zip -o "$RUNNER_TEMP/ndk.zip"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d sdk
          fi
          cd deps
          if [ ! -d freetype2 ]; then
            git clone --depth 1 --branch "VER-${v_freetype//./-}" --recurse-submodules https://gitlab.freedesktop.org/freetype/freetype.git freetype2
          fi
          if [ ! -d fribidi ]; then
            mkdir fribidi
            curl -fL --retry 3 "https://github.com/fribidi/fribidi/releases/download/v$v_fribidi/fribidi-$v_fribidi.tar.xz" | tar -xJ -C fribidi --strip-components=1
          fi
          if [ ! -d harfbuzz ]; then
            mkdir harfbuzz
            curl -fL --retry 3 "https://github.com/harfbuzz/harfbuzz/releases/download/$v_harfbuzz/harfbuzz-$v_harfbuzz.tar.xz" | tar -xJ -C harfbuzz --strip-components=1
          fi
          if [ ! -d unibreak ]; then
            mkdir unibreak
            curl -fL --retry 3 "https://github.com/adah1972/libunibreak/releases/download/libunibreak_${v_unibreak//./_}/libunibreak-${v_unibreak}.tar.gz" | tar -xz -C unibreak --strip-components=1
          fi
          if [ ! -d libxml2 ]; then
            mkdir libxml2
            curl -fL --retry 3 "https://gitlab.gnome.org/GNOME/libxml2/-/archive/v$v_libxml2/libxml2-v$v_libxml2.tar.gz" | tar -xz -C libxml2 --strip-components=1
          fi
          if [ ! -d fontconfig ]; then
            mkdir fontconfig
            curl -fL --retry 3 "https://gitlab.freedesktop.org/fontconfig/fontconfig/-/archive/${v_fontconfig}/fontconfig-${v_fontconfig}.tar.gz" | tar -xz -C fontconfig --strip-components=1
          fi
          rm -rf libass
          git clone --no-hardlinks "$base" libass
          git -C libass checkout "$GITHUB_SHA"
      - name: Build same-version subtitle stack
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          cd player/buildscripts
          chmod +x buildall.sh scripts/*.sh
          if [ ! -f "prefix/$arch/lib/libfontconfig.a" ]; then
            ./buildall.sh --arch "$arch" fontconfig
            ./buildall.sh --arch "$arch" harfbuzz
            ./buildall.sh --arch "$arch" fribidi
            ./buildall.sh --arch "$arch" unibreak
          fi
          MPVNOVA_LIBASS_REF="$GITHUB_SHA" ./buildall.sh --arch "$arch" -n libass
          # Append timing instrumentation without replacing the production
          # CPPFLAGS, including the build script's Fontconfig atomic-ref check.
          export PATH="$PWD/sdk/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd "deps/libass/_build_$arch"
          make clean
          make -j2 -f Makefile -f - <<'MAKE'
          CPPFLAGS += -DASS_FLE_PROFILE
          MAKE
          make DESTDIR="$GITHUB_WORKSPACE/player/buildscripts/prefix/$arch" install
      - name: Link standalone benchmark
        run: |
          set -euo pipefail
          arch="${{ matrix.arch }}"
          prefix="$PWD/player/buildscripts/prefix/$arch"
          toolchain="$PWD/player/buildscripts/sdk/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PKG_CONFIG_SYSROOT_DIR="$prefix"
          export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig"
          mkdir -p collected
          "$toolchain/${{ matrix.cc }}" -O2 -g -fno-omit-frame-pointer \
            profile/fle-bench.c $(pkg-config --cflags --static libass) -c -o collected/fle-bench.o
          "$toolchain/${{ matrix.cxx }}" -static-libstdc++ \
            collected/fle-bench.o $(pkg-config --libs --static libass) -o collected/fle-bench
          cp "player/buildscripts/deps/libass/_build_$arch/libass/.libs/libass.a" collected/
          cp "player/buildscripts/deps/libass/_build_$arch/config.h" collected/
          pkg-config --cflags --static libass > collected/cflags.txt
          pkg-config --libs --static libass > collected/ldflags.txt
          git rev-parse HEAD > collected/revision.txt
          tar -czf "collected/subtitle-prefix-$arch.tgz" -C player/buildscripts "prefix/$arch"
      - uses: actions/upload-artifact@v7
        with:
          name: libass-${{ matrix.arch }}-profile
          if-no-files-found: error
          path: collected/
